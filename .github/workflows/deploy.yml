name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Check dist folder
        run: ls -la dist/ && cat dist/index.html | head -5

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy using service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          firebase deploy --only hosting --project shik-4791f
