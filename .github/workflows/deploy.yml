name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Decode service account
        run: echo '${{ secrets.FIREBASE_SA_BASE64 }}' | base64 -d > /tmp/sa.json

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        id: deploy
        run: |
          firebase deploy --only hosting --project shik-4791f 2>&1 | tee /tmp/deploy.log
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        continue-on-error: true

      - name: Show deploy log
        if: steps.deploy.outcome == 'failure'
        run: cat /tmp/deploy.log

      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
