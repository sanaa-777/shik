name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: List dist folder
        run: ls -la dist/ && ls -la dist/assets/ 2>/dev/null || echo "no assets"

      - name: Decode service account
        run: echo '${{ secrets.FIREBASE_SA_BASE64 }}' | base64 -d > /tmp/sa.json

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          echo "Starting deploy..."
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting --project shik-4791f --non-interactive 2>&1
          echo "Exit code: $?"
